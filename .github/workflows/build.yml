name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds the exe. GitHub's Windows runners have no GPU (only the very slow
  # WARP software rasterizer), so GPU tests and render checks run on Linux.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # publish the "latest" pre-release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/lenia3d.exe dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: lenia3d-windows
          path: dist/
      # Also publish the exe on the Releases page (easier to download than an
      # Actions artifact). Never fails the build.
      - name: Publish "latest" pre-release
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          7z a -tzip lenia3d-windows.zip ./dist/*
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/lenia3d.exe lenia3d-windows.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($GITHUB_REF_NAME)" \
            --notes "Automatic build of $GITHUB_SHA. Download lenia3d.exe (or the zip with the README) and run it."
      - name: Unit tests (CPU only)
        run: cargo test --release --lib

  # Full test suite including GPU tests on lavapipe (software Vulkan).
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-x11-0 libasound2-dev pkg-config
      - name: Tests (including GPU tests on lavapipe)
        run: cargo test --release -- --nocapture
      - name: Build
        run: cargo build --release
      - name: Headless render smoke test
        run: |
          ./target/release/lenia3d --size 64 --steps 30 --screenshot ci-linux.png --resolution 960x540
          ./target/release/lenia3d --size 64 --steps 60 --preset "Primordial Flow" --screenshot ci-linux-flow.png --resolution 960x540
      - uses: actions/upload-artifact@v4
        with:
          name: lenia3d-linux
          path: |
            target/release/lenia3d
            ci-linux*.png
