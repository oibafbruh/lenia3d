name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --release --lib
      - name: GPU tests (WARP software DX12)
        continue-on-error: true
        timeout-minutes: 15
        env:
          WGPU_BACKEND: dx12
        run: cargo test --release --test gpu_sim -- --nocapture
      - name: Simulation smoke test (WARP)
        continue-on-error: true
        timeout-minutes: 15
        env:
          WGPU_BACKEND: dx12
        run: |
          ./target/release/lenia3d.exe --list-presets
          ./target/release/lenia3d.exe --bench --steps 10
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/lenia3d.exe dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: lenia3d-windows
          path: dist/

  # Slow: WARP is a CPU rasterizer and FXC compiles the raymarcher slowly.
  # Separate job so it never delays the Windows artifact.
  windows-dx12-render:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lenia3d-windows
      - name: Headless render on WARP (DX12)
        env:
          WGPU_BACKEND: dx12
        run: ./lenia3d.exe --size 64 --steps 20 --screenshot ci-windows.png --resolution 480x270
      - uses: actions/upload-artifact@v4
        with:
          name: ci-windows-render
          path: ci-windows.png

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-x11-0
      - name: Tests (including GPU tests on lavapipe)
        run: cargo test --release -- --nocapture
      - name: Build
        run: cargo build --release
      - name: Headless render smoke test
        run: ./target/release/lenia3d --size 64 --steps 30 --screenshot ci-linux.png --resolution 960x540
      - uses: actions/upload-artifact@v4
        with:
          name: lenia3d-linux
          path: |
            target/release/lenia3d
            ci-linux.png
