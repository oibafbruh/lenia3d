[package]
name = "lenia3d"
version = "0.1.0"
edition = "2021"
description = "Real-time 3D Lenia artificial-life sandbox on the GPU"
license = "MIT"

[lib]
name = "lenia3d"
path = "src/lib.rs"

[[bin]]
name = "lenia3d"
path = "src/main.rs"

[dependencies]
wgpu = "30"
winit = "0.30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = "0.37"
egui_plot = "0.38"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
png = "0.18"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
cpal = "0.18"

[dev-dependencies]
rustfft = "6"

[profile.release]
opt-level = 3
codegen-units = 4
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
